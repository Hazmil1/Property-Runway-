# Full application only. The public sample demo remains in render.yaml.
# First deployment needs secure environment configuration. No paid resources.
services:
  - type: web
    name: property-runway-app
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:production
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 24.3.0
      - key: NODE_ENV
        value: production
      - key: DEMO_ONLY
        value: "false"
      - key: ALLOW_DEV_AUTH
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: BOOTSTRAP_OWNER_EMAIL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PROPERTY_BUCKET
        value: property-documents
      - key: NEXT_PUBLIC_SUPABASE_PROPERTY_BUCKET
        value: property-documents
      - key: AI_EXTRACTION_MODE
        value: disabled
      - key: CRON_SECRET
        generateValue: true
      - key: BASELINE_EXISTING_SCHEMA
        value: "true"
